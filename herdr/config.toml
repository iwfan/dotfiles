onboarding = false

[theme]
name = "kanagawa"
auto_switch = false

[theme.custom]
panel_bg = "reset"
accent = "#a7c080"
green = "#a7c080"
blue = "#7fbbb3"
red = "#e67e80"
yellow = "#dbbc7f"

[keys]
# ------------------------------------------------------------------------------
# 1. Settings (全局与设置)
# ------------------------------------------------------------------------------
prefix = "ctrl+b"
settings = "prefix+comma"
detach = "prefix+d"
reload_config = "prefix+r"
resize_mode = "prefix+shift+r"

# ------------------------------------------------------------------------------
# 2. Workspace (工作区)
# ------------------------------------------------------------------------------
# Workspace picker (CMD+S sends \x02s -> prefix+s)
workspace_picker = "prefix+s"

# New workspace (CMD+Shift+N sends \x02N -> prefix+shift+n)
new_workspace = "prefix+shift+n"

# Close workspace (CMD+Shift+W sends \x02D -> prefix+shift+d)
close_workspace = "prefix+shift+d"

# Previous and next workspace (CMD+Ctrl+K/J sends \x02\x1bk / \x02\x1bj -> prefix+alt+k/j)
previous_workspace = "prefix+alt+k"
next_workspace = "prefix+alt+j"

# Switch workspace 1..9 (CMD+Ctrl+1..9 sends \x02\x1b1..9 -> prefix+alt+1..9)
switch_workspace = "prefix+alt+1..9"

# ------------------------------------------------------------------------------
# 2.5 Agents (Agent 面板)
# ------------------------------------------------------------------------------
# Previous and next agent (CMD+Shift+K/J sends \x02K / \x02J -> prefix+shift+k/j)
previous_agent = "prefix+shift+k"
next_agent = "prefix+shift+j"

# ------------------------------------------------------------------------------
# 3. Worktree (Git 工作树)
# ------------------------------------------------------------------------------
# New worktree (CMD+Shift+G sends \x02G -> prefix+shift+g)
new_worktree = "prefix+shift+g"
remove_worktree = "prefix+alt+x"

# ------------------------------------------------------------------------------
# 4. Tab (标签页)
# ------------------------------------------------------------------------------
# New tab (CMD+T sends \x02c -> prefix+c)
new_tab = "prefix+c"

# Close tab (CMD+W sends \x02X -> prefix+shift+x)
close_tab = "prefix+shift+x"

# Previous and next tab (CMD+Shift+[ sends \x02p -> prefix+p, CMD+Shift+] sends \x02n -> prefix+n)
# We also map "prefix+l" to previous_tab as a fallback for CMD+0 (\x02l).
previous_tab = ["prefix+p", "prefix+l"]
next_tab = "prefix+n"

# Switch tab 1..9 (CMD+1..9 sends \x021..9 -> prefix+1..9)
switch_tab = "prefix+1..9"

# ------------------------------------------------------------------------------
# 5. Pane (面板/分屏)
# ------------------------------------------------------------------------------
# Close pane (matches tmux 'x')
close_pane = "prefix+x"

# Zoom pane (CMD+Z sends \x02z -> prefix+z)
zoom = "prefix+z"

# Split vertical and horizontal (CMD+D sends \x02| -> prefix+|, CMD+Shift+D sends \x02- -> prefix+minus)
split_vertical = ["prefix+|", "prefix+v"]
split_horizontal = "prefix+minus"

# Cycle panes (CMD+[ sends \x02O -> prefix+shift+o, CMD+] sends \x02o -> prefix+o)
cycle_pane_previous = ["prefix+shift+tab", "prefix+shift+o"]
cycle_pane_next = ["prefix+tab", "prefix+o"]

# Last pane (CMD+\ sends \x02q -> prefix+q)
last_pane = "prefix+q"

# ------------------------------------------------------------------------------
# 6. Extra (扩展功能)
# ------------------------------------------------------------------------------
# Edit scrollback/copy mode (CMD+F sends \x02[ -> prefix+[)
edit_scrollback = "prefix+["

[[keys.command]]
key = "prefix+space"
type = "pane"
command = "zsh"
description = "Toggle popup/scratch pane"

[experimental]
kitty_graphics = true

[ui.toast]
delivery = "terminal"

[ui]
show_agent_labels_on_pane_borders = true

[session]
resume_agents_on_restore = true
