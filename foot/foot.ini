# -*- conf -*-

[main]
font = Maple Mono NF CN:size=12

shell = /home/f/.local/bin/herdr
title = " "

[colors-dark]
# Everforest Dark Hard
foreground = d3c6aa
background = 272e33

regular0 = 4c555b
regular1 = e67e80
regular2 = a7c080
regular3 = dbbc7f
regular4 = 7fbbb3
regular5 = d699b6
regular6 = 83c092
regular7 = d3c6aa

bright0 = 7a8478
bright1 = e67e80
bright2 = a7c080
bright3 = dbbc7f
bright4 = 7fbbb3
bright5 = d699b6
bright6 = 83c092
bright7 = d3c6aa

[cursor]
style = block
blink = yes

[mouse]
hide-when-typing = yes

[text-bindings]
# Alt+T → new tmux/herdr window
\x02c = Mod1+t

# Alt+W → close tmux/herdr window
\x02& = Mod1+w

# Alt+Shift+N → new workspace
\x02N = Mod1+Shift+n

# Alt+Shift+W → close workspace
\x02D = Mod1+Shift+w

# Alt+digit → switch to window
\x021 = Mod1+1
\x022 = Mod1+2
\x023 = Mod1+3
\x024 = Mod1+4
\x025 = Mod1+5
\x026 = Mod1+6
\x027 = Mod1+7
\x028 = Mod1+8
\x029 = Mod1+9
\x02l = Mod1+0

# Ctrl+Alt+digit → switch to workspace
\x02\x1b1 = Control+Mod1+1
\x02\x1b2 = Control+Mod1+2
\x02\x1b3 = Control+Mod1+3
\x02\x1b4 = Control+Mod1+4
\x02\x1b5 = Control+Mod1+5
\x02\x1b6 = Control+Mod1+6
\x02\x1b7 = Control+Mod1+7
\x02\x1b8 = Control+Mod1+8
\x02\x1b9 = Control+Mod1+9

# Alt+Shift+Left/Right → previous/next workspace
\x02\x1b[D = Mod1+Shift+Left
\x02\x1b[C = Mod1+Shift+Right

# Alt+D → horizontal split
\x02| = Mod1+d

# Alt+Shift+D → vertical split
\x02- = Mod1+Shift+d

# Alt+Shift+G → new worktree
\x02G = Mod1+Shift+g

# Alt+Shift+X → delete worktree
\x02X = Mod1+Shift+x

# Alt+Shift+[ / Super+Shift+] → switch window
\x02p = Mod1+Shift+bracketleft
\x02n = Mod1+Shift+bracketright

# Alt+[ / Super+] → previous/next window (alternate)
\x02O = Mod1+bracketleft
\x02o = Mod1+bracketright

# Alt+K → clear screen
\x0c = Mod1+k

# Alt+F → copy mode (search)
\x02[ = Mod1+f

# Alt+R → reload config
\x02r = Mod1+r

# Alt+Z → maximize/restore pane
\x02z = Mod1+z

# Alt+\ → choose pane
\x02q = Mod1+backslash

# Alt+' → tmux popup window
\x02\x20 = Mod1+apostrophe

# Alt+S → switch session
\x02s = Mod1+s

# Alt+Backspace → delete word backward
\x1b\x7f = Mod1+BackSpace

# Shift+Enter → literal newline
\x0a = Shift+Return
